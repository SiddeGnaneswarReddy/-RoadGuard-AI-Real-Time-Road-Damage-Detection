# GuardRailNet Configuration File
# AI Road Guardrail Detection & Safety Condition Monitoring System

project:
  name: "GuardRailNet"
  version: "1.0.0"
  description: "End-to-End Deep Learning System for Road Guardrail Detection, Classification & Safety Risk Telemetry"
  author: "Deep Learning Engineering Team"

classes:
  names:
    0: "metal_w_beam"            # Highway metal w-beam guardrail
    1: "concrete_jersey_barrier" # Precast concrete safety barrier
    2: "cable_barrier"           # High-tension wire rope barrier
    3: "damaged_guardrail"       # Dented, breached, or structurally deformed barrier
    4: "hazard_post"             # Reflective delineator / guard post
  num_classes: 5
  colors:
    0: [0, 210, 255]    # Cyan
    1: [255, 170, 0]    # Amber
    2: [170, 0, 255]    # Purple
    3: [255, 50, 50]    # Red (Urgent alert)
    4: [50, 255, 120]   # Bright Green

model:
  architecture: "GuardNet"       # Multi-scale CNN with Feature Pyramid & Spatial Attention
  input_size: [512, 512]         # [Height, Width]
  backbone: "guard_resnet18"     # 'guard_resnet18' or 'guard_convnet'
  anchor_grid_sizes: [16, 32, 64] # Multi-scale detection feature maps (e.g., 32x32, 16x16, 8x8)
  pretrained: false
  weights_path: "checkpoints/guardnet_best.pt"

training:
  batch_size: 8
  epochs: 25
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: "cosine"         # 'cosine', 'step', or 'plateau'
  device: "auto"                 # 'auto', 'mps' (Apple Silicon), 'cuda', or 'cpu'
  save_dir: "checkpoints"
  val_interval: 1
  early_stopping_patience: 10

loss_weights:
  box_loss: 5.0
  cls_loss: 1.0
  obj_loss: 2.0

inference:
  conf_threshold: 0.40
  iou_threshold: 0.45
  max_detections: 50
  safety_distance_warning_px: 120  # Risk zone threshold from road edge
